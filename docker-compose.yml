services:
  postgres:
    image: postgres:16-alpine
    container_name: laikela-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: laikela
      POSTGRES_PASSWORD: laikela
      POSTGRES_DB: laikela
    ports:
      - "5432:5432"
    volumes:
      - laikela-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laikela -d laikela"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: laikela-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - laikela-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # MinIO 是可选的：默认用本地目录存文件（STORAGE_DRIVER=local）。
  # 需要验证 S3 形态时：docker compose --profile s3 up -d
  # 然后把 .env 里的 STORAGE_DRIVER 改成 s3。
  minio:
    image: minio/minio:latest
    container_name: laikela-minio
    restart: unless-stopped
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: laikela
      MINIO_ROOT_PASSWORD: laikela123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - laikela-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 6s
      timeout: 4s
      retries: 20

volumes:
  laikela-pg:
  laikela-redis:
  laikela-minio:
